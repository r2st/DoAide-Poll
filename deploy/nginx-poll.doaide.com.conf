server {
    listen 80;
    server_name poll.doaide.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name poll.doaide.com;

    ssl_certificate /etc/letsencrypt/live/poll.doaide.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poll.doaide.com/privkey.pem;

    location /api/ {
        proxy_pass http://172.18.0.1:3061;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://172.18.0.1:3061;
    }

    location / {
        proxy_pass http://172.18.0.1:3062;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
